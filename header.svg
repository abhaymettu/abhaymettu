<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img">
  <defs>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="92"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#050409" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030308" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#050409"/>

  <g filter="url(#haze)">
    <ellipse cx="250" cy="150" rx="330" ry="210" fill="#2E1B57" opacity="0.46">
      <animateTransform attributeName="transform" type="translate" dur="29s"
        values="0 0; 70 -40; 0 0" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="20s"
        values="0.46;0.62;0.46" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="930" cy="300" rx="380" ry="240" fill="#1E1238" opacity="0.52">
      <animateTransform attributeName="transform" type="translate" dur="37s"
        values="0 0; -90 30; 0 0" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="26s"
        values="0.52;0.70;0.52" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="640" cy="120" rx="250" ry="160" fill="#3A2270" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" dur="23s"
        values="0 0; 60 50; 0 0" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="16s"
        values="0.3;0.41;0.3" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1090" cy="360" rx="230" ry="180" fill="#241640" opacity="0.38">
      <animateTransform attributeName="transform" type="translate" dur="41s"
        values="0 0; -70 -50; 0 0" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="29s"
        values="0.38;0.51;0.38" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect width="1200" height="400" fill="url(#vignette)"/>

  <g filter="url(#soften)" fill="none" stroke="#8E6BD8">
    <animateTransform attributeName="transform" type="rotate"
      values="-9 600 200; 351 600 200" dur="120s" repeatCount="indefinite"/>
    <ellipse cx="600" cy="200" rx="470" ry="196" stroke-opacity="0.4" stroke-width="1.8"/>
    <ellipse cx="600" cy="200" rx="392" ry="158" stroke-opacity="0.24" stroke-width="1.4"/>
    <ellipse cx="600" cy="200" rx="310" ry="120" stroke-opacity="0.13" stroke-width="1.2"/>
  </g>

  <rect width="1200" height="400" filter="url(#grain)" opacity="0.06"/>

  <text x="600.0" y="182" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="-0.5" fill="#F0EDE6">This loop keeps running only</text>
  <text x="600.0" y="260" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="-0.5" fill="#F0EDE6">while you keep narrating it</text>
</svg>
