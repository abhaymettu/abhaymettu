<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img">
  <rect width="1200" height="400" fill="#0C0C0F"/>
  <circle cx="40" cy="36" r="6.5" fill="#2E2E34"/>
  <circle cx="62" cy="36" r="6.5" fill="#2E2E34"/>
  <circle cx="84" cy="36" r="6.5" fill="#2E2E34"/>
  <line x1="0" y1="66" x2="1200" y2="66" stroke="#1C1C21" stroke-width="1"/>
  <text x="40" y="120" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="19"><tspan fill="#5E9E6E">abhay@mettu</tspan><tspan fill="#4A4A52"> ~ </tspan><tspan fill="#F2F2EE">&#10095; abhay --help</tspan></text>
  <text x="40" y="156" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#8C8C95">usage: abhay [analysis] [--audit-first] [--preregister] [--negative-control]</text>
  <text x="40" y="192" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#B9B9C0">--audit-first</text>
  <text x="300" y="192" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#8C8C95">audit the data before building on it</text>
  <text x="820" y="192" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#5E9E6E">on</text>
  <text x="40" y="228" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#B9B9C0">--preregister</text>
  <text x="300" y="228" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#8C8C95">set the threshold before looking</text>
  <text x="820" y="228" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#5E9E6E">on</text>
  <text x="40" y="264" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#B9B9C0">--negative-control</text>
  <text x="300" y="264" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#8C8C95">inject faults to prove the checks fire</text>
  <text x="820" y="264" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#5E9E6E">on</text>
  <text x="40" y="300" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#E4572E">--p-hack</text>
  <text x="300" y="300" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#E4572E">unsupported</text>
  <text x="40" y="362" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">
    <tspan fill="#5E9E6E">abhay@mettu</tspan><tspan fill="#4A4A52"> ~ </tspan><tspan fill="#F2F2EE">&#10095; &#9608;</tspan>
